name: Deploy to EC2 (ASG)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to all ASG instances
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get all healthy instance IDs from ASG
        id: get-instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.ASG_NAME }}" \
            --region us-east-1 \
            --query 'AutoScalingGroups[0].Instances[?HealthStatus==`Healthy`].InstanceId' \
            --output text | tr '\t' ' ')

          echo "instances=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          echo "Found instances: $INSTANCE_IDS"

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No healthy instances found in ASG!"
            exit 1
          fi

      - name: Deploy to all instances via SSM
        id: send-command
        run: |
          INSTANCE_IDS="${{ steps.get-instances.outputs.instances }}"

          TARGETS=$(python3 -c "
          import json
          ids = '$INSTANCE_IDS'.split()
          print(json.dumps([{'Key': 'InstanceIds', 'Values': ids}]))
          ")

          COMMAND_ID=$(aws ssm send-command \
            --targets "$TARGETS" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -e",
              "APP_DIR=/home/ec2-user/app",
              "echo === Starting deployment on $(hostname) ===",
              "if [ ! -d \"$APP_DIR/.git\" ]; then echo Cloning repo...; git clone https://github.com/Alioskillers/JIRA.git $APP_DIR; fi",
              "cd $APP_DIR",
              "git fetch origin main",
              "git reset --hard origin/main",
              "echo === Building backend ===",
              "cd $APP_DIR/backend",
              "npm install --production=false",
              "npm run build",
              "echo === Building frontend ===",
              "cd $APP_DIR/frontend",
              "npm install",
              "npm run build",
              "echo === Restarting PM2 ===",
              "cd $APP_DIR",
              "pm2 restart mini-jira 2>/dev/null || pm2 start backend/dist/main.js --name mini-jira",
              "pm2 restart mini-jira-frontend 2>/dev/null || pm2 start npm --name mini-jira-frontend -- start --prefix frontend -- -p 3001",
              "pm2 save",
              "echo === Deployment complete on $(hostname) ==="
            ]' \
            --timeout-seconds 1800 \
            --region us-east-1 \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment on all instances
        run: |
          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"
          INSTANCE_IDS="${{ steps.get-instances.outputs.instances }}"

          echo "Waiting for command $COMMAND_ID on: $INSTANCE_IDS"
          FAILED=0

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo ""
            echo "--- Polling $INSTANCE_ID ---"
            SUCCESS=0
            # 120 attempts x 15s = 30 min max wait
            for i in $(seq 1 120); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "[$INSTANCE_ID] ($i/120): $STATUS"

              if [ "$STATUS" = "Success" ]; then
                echo "[$INSTANCE_ID] SUCCESS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                SUCCESS=1
                break
              elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
                echo "[$INSTANCE_ID] FAILED: $STATUS"
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text
                FAILED=1
                break
              fi
              sleep 15
            done

            if [ "$SUCCESS" = "0" ] && [ "$FAILED" = "0" ]; then
              echo "[$INSTANCE_ID] Timed out after 30 minutes"
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "One or more instances failed!"
            exit 1
          fi

          echo ""
          echo "All instances deployed successfully!"

      - name: Notify success
        if: success()
        run: |
          echo "Deployment complete!"
          echo "CloudFront: https://d1kjmg4gujmstj.cloudfront.net"

      - name: Notify failure
        if: failure()
        run: echo "Deployment FAILED — see logs above"
